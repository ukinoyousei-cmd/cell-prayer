<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2-8셀 — 말씀과 기도</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #e8f4fd;
    --sky-mid: #c5e3f7;
    --meadow: #7bc67e;
    --meadow-dark: #4caf50;
    --meadow-deep: #2d7a30;
    --sun: #ffd54f;
    --sun-glow: #ffb300;
    --cloud: #ffffff;
    --peach: #ffb3a7;
    --lavender: #c5b3e6;
    --text-dark: #2c3e2d;
    --text-mid: #4a6b4c;
    --text-light: #ffffff;
    --card-prayer: #fff8f0;
    --card-quiz: #f0f8ff;
    --btn-prayer: #f4845f;
    --btn-prayer-dark: #e05a30;
    --btn-quiz: #5b9bd5;
    --btn-quiz-dark: #3a78b5;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--sky);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SCENE ── */
  .scene {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden;
  }

  /* Sky gradient */
  .sky-bg {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      #b3e0f7 0%,
      #ceeaf9 30%,
      #e8f4fd 60%,
      #d4edda 80%,
      #a8d5a2 100%
    );
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 6%; right: 12%;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff9c4, #ffd54f 50%, #ffb300);
    box-shadow:
      0 0 0 16px rgba(255,213,79,0.18),
      0 0 0 32px rgba(255,213,79,0.10),
      0 0 0 50px rgba(255,213,79,0.05);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 0 16px rgba(255,213,79,0.18), 0 0 0 32px rgba(255,213,79,0.10), 0 0 0 50px rgba(255,213,79,0.05); }
    50% { box-shadow: 0 0 0 22px rgba(255,213,79,0.22), 0 0 0 44px rgba(255,213,79,0.12), 0 0 0 66px rgba(255,213,79,0.06); }
  }

  /* Sun rays */
  .sun-ray {
    position: absolute;
    top: 50%; left: 50%;
    width: 2px; height: 22px;
    background: rgba(255,213,79,0.5);
    border-radius: 2px;
    transform-origin: 50% 70px;
    animation: rayRotate 12s linear infinite;
  }
  @keyframes rayRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Clouds */
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.88;
    animation: floatCloud var(--dur, 60s) linear infinite var(--delay, 0s);
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute;
    background: white; border-radius: 50%;
  }
  .cloud-1 { width:120px; height:40px; top:12%; left:-140px; --dur:55s; --delay:-20s; }
  .cloud-1::before { width:55px; height:55px; top:-25px; left:15px; }
  .cloud-1::after { width:40px; height:40px; top:-18px; left:55px; }

  .cloud-2 { width:90px; height:30px; top:22%; left:-110px; --dur:70s; --delay:-40s; opacity:0.7; }
  .cloud-2::before { width:40px; height:40px; top:-18px; left:10px; }
  .cloud-2::after { width:30px; height:30px; top:-12px; left:42px; }

  .cloud-3 { width:150px; height:45px; top:8%; left:-170px; --dur:80s; --delay:-60s; opacity:0.6; }
  .cloud-3::before { width:60px; height:60px; top:-28px; left:20px; }
  .cloud-3::after { width:50px; height:50px; top:-22px; left:70px; }

  @keyframes floatCloud {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* Birds */
  .bird {
    position: absolute;
    animation: flyBird var(--bdur, 18s) linear infinite var(--bdelay, 0s);
    opacity: 0.7;
  }
  .bird svg { width: 28px; height: 14px; }
  .bird-1 { top: 18%; left: -40px; --bdur: 18s; --bdelay: -5s; }
  .bird-2 { top: 24%; left: -40px; --bdur: 22s; --bdelay: -12s; }
  @keyframes flyBird {
    from { transform: translateX(-50px); }
    to { transform: translateX(calc(100vw + 60px)); }
  }

  /* Ground */
  .ground {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 38%;
    background: linear-gradient(180deg, #a8d5a2 0%, #7bc67e 30%, #5aad5e 100%);
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  .ground::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, #a8d5a2 0%, #6db870 100%);
    clip-path: ellipse(75% 100% at 30% 100%);
  }
  .ground::after {
    content:''; position:absolute; inset:0;
    background: linear---dawn-deep;
  }

  /* Flowers */
  .flowers {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 160px;
    pointer-events: none;
  }

  /* Trees */
  .tree {
    position: absolute; bottom: 0;
  }
  .tree-trunk {
    width: 14px; height: 60px;
    background: linear-gradient(to right, #795548, #a1887f);
    border-radius: 4px 4px 0 0;
    margin: 0 auto;
  }
  .tree-top {
    width: 70px; height: 80px;
    background: radial-gradient(ellipse at 40% 40%, #81c784, #388e3c);
    border-radius: 50% 50% 40% 40%;
    margin: 0 auto -10px;
    box-shadow: inset -6px -6px 12px rgba(0,0,0,0.1);
  }
  .tree-top-2 {
    width: 55px; height: 65px;
    background: radial-gradient(ellipse at 40% 35%, #a5d6a7, #4caf50);
    border-radius: 50% 50% 40% 40%;
    margin: 0 auto -8px;
  }
  .tree-left { left: 3%; }
  .tree-right { right: 4%; }
  .tree-far-left { left: 10%; transform: scale(0.75); transform-origin: bottom center; }
  .tree-far-right { right: 12%; transform: scale(0.8); transform-origin: bottom center; }

  /* ── CONTENT ── */
  .page {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  /* Church badge */
  .church-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(123,198,126,0.5);
    border-radius: 30px;
    padding: 7px 18px;
    font-size: 12px; font-weight: 500;
    color: var(--meadow-deep);
    letter-spacing: 1px;
    margin-bottom: 28px;
    box-shadow: 0 2px 12px rgba(76,175,80,0.12);
    animation: fadeDown 0.8s ease both;
  }
  .church-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--meadow-dark);
  }

  /* Main title */
  .main-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.35;
    margin-bottom: 14px;
    animation: fadeDown 0.9s ease 0.1s both;
    text-shadow: 0 2px 8px rgba(255,255,255,0.7);
  }
  .main-title .highlight {
    color: var(--meadow-deep);
    position: relative;
    display: inline-block;
  }
  .main-title .highlight::after {
    content:'';
    position: absolute; bottom: -2px; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, var(--meadow-dark), var(--sun));
    border-radius: 2px;
  }

  /* Subtitle */
  .subtitle {
    font-size: clamp(13px, 2.5vw, 16px);
    color: var(--text-mid);
    line-height: 1.8;
    max-width: 420px;
    margin-bottom: 50px;
    font-weight: 400;
    animation: fadeDown 1s ease 0.2s both;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(4px);
    padding: 12px 20px;
    border-radius: 16px;
  }

  /* Buttons */
  .buttons {
    display: flex; gap: 20px; flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 1s ease 0.35s both;
  }

  .btn-card {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    background: white;
    border-radius: 24px;
    padding: 28px 28px 24px;
    width: 190px;
    text-decoration: none;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.10),
      0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .btn-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.14), 0 4px 12px rgba(0,0,0,0.08);
  }

  .btn-card.prayer {
    border-color: rgba(244,132,95,0.3);
    background: linear-gradient(135deg, #fff8f5, #ffffff);
  }
  .btn-card.prayer:hover { border-color: var(--btn-prayer); }

  .btn-card.quiz {
    border-color: rgba(91,155,213,0.3);
    background: linear-gradient(135deg, #f5f9ff, #ffffff);
  }
  .btn-card.quiz:hover { border-color: var(--btn-quiz); }

  .btn-icon {
    width: 64px; height: 64px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .prayer .btn-icon {
    background: linear-gradient(135deg, #ffe0d6, #ffb3a7);
    box-shadow: 0 4px 12px rgba(244,132,95,0.3);
  }
  .quiz .btn-icon {
    background: linear-gradient(135deg, #d6e8ff, #b3cfee);
    box-shadow: 0 4px 12px rgba(91,155,213,0.3);
  }

  .btn-label {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 16px; font-weight: 700;
    color: var(--text-dark);
  }
  .btn-desc {
    font-size: 11px; color: #888; line-height: 1.5;
    text-align: center;
  }

  .btn-go {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .prayer .btn-go {
    background: linear-gradient(135deg, var(--btn-prayer), var(--btn-prayer-dark));
    color: white;
    box-shadow: 0 3px 10px rgba(244,132,95,0.4);
  }
  .quiz .btn-go {
    background: linear-gradient(135deg, var(--btn-quiz), var(--btn-quiz-dark));
    color: white;
    box-shadow: 0 3px 10px rgba(91,155,213,0.4);
  }

  /* Verse */
  .verse {
    margin-top: 44px;
    font-family: 'Nanum Myeongjo', serif;
    font-size: 12px;
    color: var(--text-mid);
    font-style: italic;
    opacity: 0.8;
    animation: fadeUp 1s ease 0.5s both;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(4px);
    padding: 8px 18px;
    border-radius: 20px;
  }

  /* Decorative floating elements */
  .floater {
    position: fixed; pointer-events:none; z-index:1;
    animation: floatUp var(--ft, 6s) ease-in-out infinite var(--fd, 0s);
  }
  @keyframes floatUp {
    0%,100% { transform: translateY(0) rotate(var(--fr, 0deg)); }
    50% { transform: translateY(-12px) rotate(var(--fr2, 5deg)); }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-16px); }
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(16px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .buttons { flex-direction: column; align-items: center; }
    .btn-card { width: 240px; flex-direction: row; text-align: left; padding: 20px 22px; }
    .btn-icon { width: 52px; height: 52px; flex-shrink:0; font-size:24px; }
    .btn-desc { display: none; }
  }
</style>
</head>
<body>

<!-- Scene -->
<div class="scene">
  <div class="sky-bg"></div>

  <!-- Sun -->
  <div class="sun">
    <div class="sun-ray" style="transform: rotate(0deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(45deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(90deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(135deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(180deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(225deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(270deg) translateY(-70px);"></div>
    <div class="sun-ray" style="transform: rotate(315deg) translateY(-70px);"></div>
  </div>

  <!-- Clouds -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- Birds -->
  <div class="bird bird-1">
    <svg viewBox="0 0 28 14" fill="none">
      <path d="M14 7 Q8 2 2 5 Q8 5 14 7" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    </svg>
  </div>
  <div class="bird bird-2">
    <svg viewBox="0 0 28 14" fill="none">
      <path d="M14 7 Q8 2 2 5 Q8 5 14 7" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M14 7 Q20 2 26 5 Q20 5 14 7" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Ground -->
  <div class="ground"></div>

  <!-- Trees -->
  <div class="tree tree-left">
    <div class="tree-top"></div>
    <div class="tree-trunk"></div>
  </div>
  <div class="tree tree-right">
    <div class="tree-top"></div>
    <div class="tree-trunk"></div>
  </div>
  <div class="tree tree-far-left">
    <div class="tree-top-2"></div>

  <div class="tree tree-far-right">
    <div class="tree-top-2"></div>
    <div class="tree-trunk" style="width:10px;height:45px;"></div>
  </div>

  <!-- SVG flowers & grass -->
  <svg style="position:absolute;bottom:0;left:0;width:100%;height:180px;pointer-events:none;" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMax meet">
    <!-- grass blades -->
    <g fill="#4caf50" opacity="0.6">

      <ellipse cx="750" cy="171" rx="3" ry="14" transform="rotate(4 750 171)"/>

      <ellipse cx="1150" cy="168" rx="4" ry="17" transform="rotate(-4 1150 168)"/>
    </g>
    <!-- flowers left -->
    <g transform="translate(130, 145)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#66bb6a" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#ff8a65" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#fff9c4"/>
    </g>
    <g transform="translate(160, 150)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#66bb6a" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#f06292" opacity="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
    </g>
    <g transform="translate(145, 142)">
      <line x1="0" y1="0" x2="-4" y2="28" stroke="#66bb6a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#ffd54f" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
    <!-- flowers center -->
    <g transform="translate(560, 148)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#66bb6a" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#ba68c8" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#fff9c4"/>
    </g>
    <g transform="translate(580, 152)">

    <!-- flowers right -->
    <g transform="translate(1000, 146)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#66bb6a" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#ffd54f" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    </g>
    <g transform="translate(1020, 150)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#66bb6a" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#f06292" opacity="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
    </g>
    <!-- butterflies -->
    <g transform="translate(420, 110)" opacity="0.8">
      <ellipse cx="-8" cy="-4" rx="9" ry="6" fill="#f8bbd0" transform="rotate(-20 -8 -4)"/>
      <ellipse cx="8" cy="-4" rx="9" ry="6" fill="#f8bbd0" transform="rotate(20 8 -4)"/>
      <ellipse cx="-6" cy="4" rx="6" ry="4" fill="#fce4ec" transform="rotate(15 -6 4)"/>

      <ellipse cx="0" cy="0" rx="1.5" ry="6" fill="#01579b"/>
    </g>
  </svg>
</div>

<!-- Floating elements -->
<div class="floater" style="top:15%;left:8%;--ft:7s;--fd:-2s;--fr:-5deg;--fr2:5deg;font-size:22px;">🌿</div>
<div class="floater" style="top:30%;right:10%;--ft:5.5s;--fd:-1s;--fr:3deg;--fr2:-4deg;font-size:18px;">✨</div>

<div class="floater" style="bottom:32%;right:14%;--ft:6s;--fd:-3s;--fr:4deg;--fr2:-3deg;font-size:20px;">🍃</div>

<!-- Page content -->
<div class="page">
  <div class="church-badge">
    <span class="dot"></span>
    선한목자교회 고등부 2-8셀
    <span class="dot"></span>
  </div>

  <h1 class="main-title">
    말씀으로 함께,<br>
    기도로 <span class="highlight">하나</span>되어요

  <p class="subtitle">
    말씀을 함께 읽고<br>서로를 위해 기도하는 우리들의 공간이에요 🌿
  </p>

  <div class="buttons">
    <a class="btn-card prayer" href="https://ukinoyousei-cmd.github.io/cell-prayer/prayer_list.html" target="_self">

      <div class="btn-label">기도제목 나눔</div>

  <div class="verse">

  </div>
</div>

</body>
